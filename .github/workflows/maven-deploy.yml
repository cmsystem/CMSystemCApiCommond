name: Java Maven Deploy

on:
  workflow_run:
    workflows: [ "Java CI with Maven" ]   
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:                      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft'
        cache: maven

    - name: Get Maven project version
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "version=$VERSION" >> $GITHUB_ENV

    - name: Install jq
      run: sudo apt-get install -y jq

    - name: Delete old package versions (keep latest)
      run: |
        PACKAGE_NAME="com.pe.cmsystem.api.commond"
        OWNER="cmsystem"
        PACKAGE_TYPE="maven"
        TOKEN=$GITHUB_TOKEN

        echo "Fetching package versions for $PACKAGE_NAME..."

        RESPONSE=$(curl -s -H "Authorization: Bearer $TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/users/$OWNER/packages/$PACKAGE_TYPE/$PACKAGE_NAME/versions)

        VERSION_IDS=$(echo "$RESPONSE" | jq '.[].id')

        echo "Found versions:"
        echo "$VERSION_IDS"

        # Keep only the most recent version (first in list)
        COUNT=0
        for VERSION_ID in $VERSION_IDS; do
          COUNT=$((COUNT+1))
          if [ "$COUNT" -gt 1 ]; then
            echo "Deleting version ID: $VERSION_ID"
            curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/users/$OWNER/packages/$PACKAGE_TYPE/$PACKAGE_NAME/versions/$VERSION_ID
          fi
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}

    # GitHub Packages no permite volver a publicar una versión existente (409 Conflict),
    # así que si la versión del pom ya está publicada se elimina para sobrescribirla.
    - name: Delete current version if it already exists
      run: |
        PACKAGE_NAME="com.pe.cmsystem.api.commond"
        OWNER="cmsystem"
        PACKAGE_TYPE="maven"
        API="https://api.github.com/users/$OWNER/packages/$PACKAGE_TYPE/$PACKAGE_NAME"
        AUTH=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json")

        RESPONSE=$(curl -s "${AUTH[@]}" "$API/versions")
        CURRENT_ID=$(echo "$RESPONSE" | jq -r --arg v "$version" '.[]? | select(.name == $v) | .id')
        TOTAL=$(echo "$RESPONSE" | jq '[.[]?] | length')

        if [ -z "$CURRENT_ID" ]; then
          echo "La versión $version no existe todavía, se publicará normalmente."
          exit 0
        fi

        if [ "$TOTAL" -le 1 ]; then
          # GitHub no deja borrar la última versión de un paquete: se borra el paquete completo
          echo "La versión $version es la única publicada, eliminando el paquete para republicarlo..."
          curl -s -f -X DELETE "${AUTH[@]}" "$API"
        else
          echo "La versión $version ya existe (id $CURRENT_ID), eliminándola para republicarla..."
          curl -s -f -X DELETE "${AUTH[@]}" "$API/versions/$CURRENT_ID"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}

    - name: Deploy package to GitHub Packages
      run: mvn clean deploy -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/cmsystem/CMSystemCApiCommond
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
